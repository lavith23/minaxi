<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Chit-Chat 🔥</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#0b141a;height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:420px;background:#0b141a;display:flex;flex-direction:column;height:100vh}
.header{background:#202c33;color:white;padding:12px 15px;display:flex;align-items:center;gap:10px}
.header b{font-size:17px}.header span{font-size:12px;color:#00ff88}
.login{padding:20px;color:white;text-align:center}
.login input{width:100%;padding:13px;border-radius:10px;border:none;margin:10px 0;outline:none;background:#2a3942;color:white;font-size:16px}
.login button{width:100%;padding:13px;background:#00a884;border:none;color:white;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
.chat{flex:1;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:10px 12px;border-radius:12px;font-size:15px;color:white}
.me{align-self:flex-end;background:#005c4b}
.other{align-self:flex-start;background:#202c33}
.name{font-size:11px;opacity:.7;margin-bottom:3px}
.input-area{display:flex;gap:8px;padding:10px;background:#202c33}
.input-area input{flex:1;padding:12px;border-radius:25px;border:none;outline:none;background:#2a3942;color:white}
.input-area button{background:#00a884;border:none;width:48px;height:48px;border-radius:50%;color:white;font-size:20px;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <div class="header"><b>Real Chit-Chat 💬</b><span id="status">● online</span></div>

  <!-- LOGIN -->
  <div class="login" id="loginBox">
    <h2>Apna Naam Likho 😎</h2>
    <input id="myName" placeholder="Jaise - Aman">
    <input id="roomId" placeholder="Room Code - Jaise 1234" value="1234">
    <button onclick="join()">CHAT SHURU KARO 🔥</button>
    <p style="font-size:13px;opacity:.6;margin-top:12px">Dono log same Room Code daalenge<br>toh dono ek hi chat me aa jayenge</p>
  </div>

  <!-- CHAT -->
  <div id="chatBox" style="display:none;flex:1;flex-direction:column">
    <div class="chat" id="chat"></div>
    <div class="input-area">
      <input id="inp" placeholder="Message..." onkeydown="if(event.key==='Enter') sendMsg()">
      <button onclick="sendMsg()">➤</button>
    </div>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
// 👇 YAHAN APNA FIREBASE CONFIG DALO 👇
const firebaseConfig = {
  apiKey: "TUMHARI_API_KEY",
  authDomain: "tumhara-project.firebaseapp.com",
  databaseURL: "https://tumhara-project-default-rtdb.firebaseio.com",
  projectId: "tumhara-project",
  storageBucket: "tumhara-project.appspot.com",
  messagingSenderId: "123456",
  appId: "1:123456:web:abc"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let myName = "", roomId = "";
function join(){
  myName = document.getElementById('myName').value.trim() || "Guest";
  roomId = document.getElementById('roomId').value.trim() || "1234";
  document.getElementById('loginBox').style.display='none';
  document.getElementById('chatBox').style.display='flex';

  // Jab bhi naya message aaye, screen pe dikhao
  db.ref('rooms/'+roomId).on('child_added', (snap)=>{
    let m = snap.val();
    let div = document.createElement('div');
    div.className = 'msg ' + (m.name===myName ? 'me':'other');
    div.innerHTML = `<div class="name">${m.name}</div>${m.text}`;
    document.getElementById('chat').appendChild(div);
    document.getElementById('chat').scrollTop = 99999;
  });
}
function sendMsg(){
  let inp = document.getElementById('inp');
  let text = inp.value.trim();
  if(!text) return;
  db.ref('rooms/'+roomId).push({name:myName, text:text, time:Date.now()});
  inp.value='';
}
</script>
</body>
</html>
